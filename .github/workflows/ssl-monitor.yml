name: SSL Certificate Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ssl:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSL certificate
        shell: bash
        run: |
          DOMAIN="app.cmercury.com"
          EXPECTED_DOMAIN="app.cmercury.com"
          SERVER_IP="208.100.49.130"

          CERT_FILE=$(mktemp)

          echo | openssl s_client \
            -connect "${DOMAIN}:443" \
            -servername "${DOMAIN}" \
            -showcerts 2>/dev/null \
            | openssl x509 -out "$CERT_FILE"

          if [ ! -s "$CERT_FILE" ]; then
            echo "SSL_CHECK_FAILED=true" >> "$GITHUB_ENV"
            echo "SSL_ALERT_TYPE=SSL Connection Failed" >> "$GITHUB_ENV"
            echo "SSL_MESSAGE=Unable to retrieve SSL certificate from ${DOMAIN}:443." >> "$GITHUB_ENV"
            echo "SSL_SUBJECT=Certificate unavailable" >> "$GITHUB_ENV"
            echo "SSL_ISSUER=Unknown" >> "$GITHUB_ENV"
            echo "SSL_EXPIRY=Unknown" >> "$GITHUB_ENV"
            echo "SSL_NOT_BEFORE=Unknown" >> "$GITHUB_ENV"
            exit 0
          fi

          SUBJECT=$(openssl x509 -in "$CERT_FILE" -noout -subject | sed 's/^subject=//')
          ISSUER=$(openssl x509 -in "$CERT_FILE" -noout -issuer | sed 's/^issuer=//')
          EXPIRY=$(openssl x509 -in "$CERT_FILE" -noout -enddate | cut -d= -f2)
          NOT_BEFORE=$(openssl x509 -in "$CERT_FILE" -noout -startdate | cut -d= -f2)
          SERIAL=$(openssl x509 -in "$CERT_FILE" -noout -serial | cut -d= -f2)

          echo "SSL_SUBJECT=$SUBJECT" >> "$GITHUB_ENV"
          echo "SSL_ISSUER=$ISSUER" >> "$GITHUB_ENV"
          echo "SSL_EXPIRY=$EXPIRY" >> "$GITHUB_ENV"
          echo "SSL_NOT_BEFORE=$NOT_BEFORE" >> "$GITHUB_ENV"
          echo "SSL_SERIAL=$SERIAL" >> "$GITHUB_ENV"

          # Check certificate expiry
          if ! openssl x509 -in "$CERT_FILE" -noout -checkend 0 >/dev/null 2>&1; then
            echo "SSL_CHECK_FAILED=true" >> "$GITHUB_ENV"
            echo "SSL_ALERT_TYPE=SSL Certificate Expired" >> "$GITHUB_ENV"
            echo "SSL_MESSAGE=The SSL certificate for ${DOMAIN} has expired." >> "$GITHUB_ENV"
            exit 0
          fi

          # Check hostname
          if ! openssl x509 -in "$CERT_FILE" -noout -checkhost "$EXPECTED_DOMAIN" >/dev/null 2>&1; then
            echo "SSL_CHECK_FAILED=true" >> "$GITHUB_ENV"
            echo "SSL_ALERT_TYPE=Wrong SSL Certificate" >> "$GITHUB_ENV"
            echo "SSL_MESSAGE=The certificate presented by ${DOMAIN} does not match ${EXPECTED_DOMAIN}." >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SSL_CHECK_FAILED=false" >> "$GITHUB_ENV"
          echo "SSL_ALERT_TYPE=SSL Certificate OK" >> "$GITHUB_ENV"
          echo "SSL_MESSAGE=SSL certificate is valid and matches ${DOMAIN}." >> "$GITHUB_ENV"

          echo "SSL certificate check completed successfully."

      - name: Send SSL Alert through EmailJS
        if: always()
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            "https://api.emailjs.com/api/v1.0/email/send" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg service_id "${{ secrets.EMAILJS_SERVICE_ID }}" \
              --arg template_id "${{ secrets.EMAILJS_TEMPLATE_ID }}" \
              --arg user_id "${{ secrets.EMAILJS_PUBLIC_KEY }}" \
              --arg domain "app.cmercury.com" \
              --arg server_ip "208.100.49.130" \
              --arg alert_type "${{ env.SSL_ALERT_TYPE }}" \
              --arg message "${{ env.SSL_MESSAGE }}" \
              --arg certificate_subject "${{ env.SSL_SUBJECT }}" \
              --arg certificate_issuer "${{ env.SSL_ISSUER }}" \
              --arg valid_from "${{ env.SSL_NOT_BEFORE }}" \
              --arg valid_until "${{ env.SSL_EXPIRY }}" \
              --arg expected_hostname "app.cmercury.com" \
              --arg expected_certificate "*.cmercury.com" \
              '{
                service_id: $service_id,
                template_id: $template_id,
                user_id: $user_id,
                template_params: {
                  domain: $domain,
                  server_ip: $server_ip,
                  alert_type: $alert_type,
                  message: $message,
                  certificate_subject: $certificate_subject,
                  certificate_issuer: $certificate_issuer,
                  valid_from: $valid_from,
                  valid_until: $valid_until,
                  expected_hostname: $expected_hostname,
                  expected_certificate: $expected_certificate
                }
              }')"

          echo "SSL alert email sent through EmailJS."
